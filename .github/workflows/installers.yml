name: Build desktop installers
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/installers.yml
      - electron-builder.yml
      - electron.vite.config.ts
      - package.json
      - pnpm-lock.yaml
      - src/**
      - resources/**
      - scripts/**
permissions:
  contents: read
jobs:
  installers:
    name: ${{ matrix.platform }}-${{ matrix.arch }} (unsigned test build)
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            arguments: --win nsis --x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            arguments: --linux AppImage --x64
          - os: macos-15
            platform: macos
            arch: arm64
            arguments: --mac dmg --arm64 --config.mac.identity=- --config.mac.notarize=false
          - os: macos-15-intel
            platform: macos
            arch: x64
            arguments: --mac dmg --x64 --config.mac.identity=- --config.mac.notarize=false
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm audit --prod
      - run: pnpm build
      - name: Package unsigned installer for native testing
        run: pnpm exec electron-builder ${{ matrix.arguments }} --publish never
      - name: Inspect packaged application
        if: runner.os != 'macOS'
        run: pnpm package:verify
      - name: Collect installers and SHA-256 checksums
        run: node scripts/collect-installers.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: kuskus-${{ matrix.platform }}-${{ matrix.arch }}-unsigned-test
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
