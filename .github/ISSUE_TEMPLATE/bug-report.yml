name: Bug report
description: Report something that isn't working.
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Use sample content and remove personal data from screenshots and logs. For vulnerabilities, follow SECURITY.md instead of posting details here.
  - type: input
    id: version
    attributes:
      label: Kuskus version or commit
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and architecture
      placeholder: Windows 11, x64
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Tell us how to make it happen, starting from opening the app.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Checks and supporting details
      description: Does it happen with pnpm dev:demo? Add redacted logs or screenshots if useful. Say if you couldn't check.
