packages:
  - landing-page

shamefullyHoist: true

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Exact security fixes from the full development-tool audit (2026-10-26).
  - fast-uri@3.1.9
  - brace-expansion@2.1.7
  - tar@7.5.22
  - '@xmldom/xmldom@0.8.15'
  - http-cache-semantics@4.3.0
  - body-parser@2.4.0
  # Security patches verified against the installer audit advisories.
  - electron@44.9.1
  - undici@7.30.1
  - eventsource-parser@3.1.1
  - recast@0.23.21
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@5.7.2
  - semver@6.3.1
  - undici-types@6.21.0
# pnpm/pnpm#10622: false-positive "high-risk trust downgrade" for long-established
# versions (semver@6.3.1) that the exclude above doesn't cover. Skip the check for
# anything published over 7 days ago; newer releases are still fully vetted.
trustPolicyIgnoreAfter: 10080

# Security fixes for transitive HTML sanitization and math rendering.
overrides:
  dompurify: ^3.4.17
  katex: 0.18.10
  undici: ^7.30.1
  proxy-addr: ^2.0.8
  # Keep vulnerable transitive versions above the audited patch floor, within each API major.
  fast-uri@3: ^3.1.9
  brace-expansion@2: ^2.1.7
  tar@7: ^7.5.22
  '@xmldom/xmldom@0.8': ^0.8.15
  http-cache-semantics@4: ^4.3.0
  body-parser@2: ^2.4.0

  # PDF.js uses Chromium's canvas in the renderer; its optional Node backend is unused.
  'pdfjs-dist>@napi-rs/canvas': '-'
