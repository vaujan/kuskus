appId: app.kuskus.desktop
productName: Kuskus
directories:
  buildResources: build
files:
  - out/**
  - resources/**
  - LICENSE
  - THIRD_PARTY_NOTICES.txt
  - package.json
asarUnpack:
  - resources/**
win:
  executableName: kuskus
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# macOS and Linux builds are experimental; the release command targets Windows.
mac:
  icon: build/icon.png
  notarize: true
  category: public.app-category.productivity
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  icon: build/icon.png
  target: [AppImage]
  category: Utility
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
publish: null
