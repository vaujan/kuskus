appId: app.kuskus.desktop
productName: Kuskus
directories:
  buildResources: build
files:
  - out/**
  - resources/**
  - LICENSE
  - THIRD_PARTY_NOTICES.txt
  - package.json
asarUnpack:
  - resources/**
win:
  executableName: kuskus
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# macOS and Linux remain experimental until native installation checks pass.
mac:
  icon: build/icon.png
  target: [dmg]
  extraFiles:
    - from: node_modules/electron/dist/LICENSE
      to: Resources/LICENSE.electron.txt
    - from: node_modules/electron/dist/LICENSES.chromium.html
      to: Resources/LICENSES.chromium.html
  minimumSystemVersion: 13.0.0
  notarize: true
  category: public.app-category.productivity
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  icon: build/icon.png
  target: [AppImage]
  category: Utility
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
publish: null
